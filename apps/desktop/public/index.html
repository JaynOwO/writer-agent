<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Siglum</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">S<span>Siglum</span><small>0.0.9 · DESKTOP PREVIEW</small></div><div id="workspace-name"></div><div class="header-actions"><button id="open">打开工作区</button><button id="create">新建工作区</button><button id="settings">连接</button><button id="language">EN</button></div></header>
<div id="notice" role="status" aria-live="polite"></div><div class="shell"><nav><div class="nav-title" id="documents-label">文章</div><div class="nav-actions"><button id="new-document">＋ 新文章</button><button id="import-document">导入</button></div><div id="documents"></div><div class="nav-title" id="tasks-label">写作任务</div><button id="new-run">＋ 新任务</button><div id="runs"></div><div class="nav-bottom"><button id="sources">资料库</button><button id="profiles">写作档案</button><button id="diagnostics">诊断与验证</button><button id="install">安装到本机</button></div></nav><main id="main" tabindex="-1"></main><aside id="aside"></aside></div>
<footer><span id="status">本地优先 · 作者决定</span><span id="jobs"></span><button id="panel-toggle" class="flat">收起侧栏</button></footer>
<dialog id="modal"><div id="modal-body"></div><div id="modal-actions"></div></dialog><script src="app.js"></script></body></html>
